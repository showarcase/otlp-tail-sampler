[traffic]
start_unix_nano = 1_767_225_600_000_000_000
propagate_error_probability = 0.7
network_delay_ms = [5, 40]
default_export_interval_ms = 500

[calibration_traffic]
seed = 11
duration_seconds = 450
requests_per_second = 60.0
incidents = false

[evaluation_traffic]
seed = 7
duration_seconds = 900
requests_per_second = 60.0
incidents = true

[evaluation]
slow_quantile = 0.99
decision_wait_seconds = [1.0, 2.0, 5.0, 10.0, 20.0]
baseline_rates = [0.01, 0.02, 0.05, 0.1]
benchmark_repeats = 3

[[exporter]]
service = "notifications"
interval_ms = 5000

[[incident]]
name = "search-subtle-shift"
kind = "latency"
operation = "search.index"
start_second = 100
end_second = 400
probability = 1.0
added_median_ms = 12.0
added_sigma = 0.2

[[incident]]
name = "payments-latency-regression"
kind = "latency"
operation = "payments.charge"
start_second = 450
end_second = 600
probability = 0.5
added_median_ms = 300.0
added_sigma = 0.3

[[incident]]
name = "inventory-error-burst"
kind = "errors"
operation = "inventory.reserve"
start_second = 700
end_second = 760
probability = 0.4

[[operation]]
name = "frontend.home"
service = "frontend"
span_name = "GET /"
self_median_ms = 3.0
self_sigma = 0.4
error_rate = 0.0005
entrypoint_weight = 0.30
calls = [
  { operation = "catalog.list" },
  { operation = "ranking.score", probability = 0.7 },
]

